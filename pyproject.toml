[project]
name = "kcai-workspace"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "pre-commit>=4.5.0",
    "pycocotools>=2.0.10",
    "jupyterlab>=4.0.0",
    "kcai-data-sampling",
    "kcai-dataset",
    "pyautoattack>=0.1.1",
    "cleverhans @ git+https://github.com/cleverhans-lab/cleverhans.git"
]

[project.urls]
Homepage = "https://github.com/Safenai/kcai-workspace"
Documentation = "https://safenai.github.io/kcai-workspace"
Repository = "https://github.com/Safenai/kcai-workspace"

[project.scripts]
kcai-cli = "kcai_workspace.cli.main:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

# UV Configuration workspace
# - dependency groupes, repositoy packages to includes, etc.
[tool.uv.sources]
kcai-data-sampling = { workspace = true }
kcai-dataset = { workspace = true }

[tool.uv]
default-groups = ["nox", "lint", "type_check"]

[tool.uv.workspace]
members = ["packages/*"]
exclude = [""]

# Dependency gourps of the workspace depending actions performed in the workspace
[dependency-groups]

nox = [
    "nox-uv",
]

test = [
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "ruamel-yaml>=0.19.1",
    # Plugin to generate a HTML report for test results
    "pytest-html",
    # Plugin to show failures and errors instantly, add a progress bar,
    # improve the test results, and make the output look better
    "pytest-sugar",
    "pytest-timeout",
    # to download open source datasets
    "fiftyone",
    "strawberry-graphql==0.287.3" # TODO : pinning to avoid deprecated dependency issue with fiftyone
]

type_check = [
    "mypy",
    # Add "types-" stub packages as needed: https://github.com/python/typeshed/tree/main/stubs
    "types-PyYAML",
]

lint = [
    "ruff",
]

docs = [
    "mkdocs-material",
    "mkdocs-htmlproofer-plugin",

    # Python API documentation (not neccessary for applications).
    "mkdocstrings[python]",
    # Autodoc.
    "mkdocs-api-autonav",
    "mkdocs-jupyter",
    "mkdocs-simple-hooks",
]

licenses = [
    "pip-licenses-cli",
]

####################################################################################
# Dev tools configurations

[tool.mypy]
ignore_missing_imports = true
strict = true
enable_error_code = ["deprecated", "exhaustive-match", "explicit-override"]
# If certain strict config options are too pedantic for a project,
# disable them selectively here by setting to false.

[tool.ruff]
line-length = 120
src = ["src", "packages/kcai-data-sampling/src", "packages/kcai-dataset/src"]
extend-exclude = [""]
# Ruff will automatically exclude all files listed in .gitignore as well as common temporary Python
# tool directories.
# To exclude additional folders, use extend-exclude.

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "RUF", # ruff
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "PT", # flake-pytest-style
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
extend-ignore = [
    "RUF005",
    "RUF100",
    "RUF012",
    "I001"
]
unfixable = [
    # Disable removing unused imports by default and only enable within nox so editors don't delete
    # unused imports while the user is in the middle of editing a file on save.
    "F401",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false
# For non-src directory projects, explicitly set top level package names:
# known-first-party = ["my-app"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--html=pytest_report.html",
    # Force sugar on gitlab runner
    "--force-sugar",
    # Set global timeout for each test
    "--timeout=300",
    # Set full verbose
    "-vv",
    "-s",
    #"--log-cli-level=DEBUG",
]

xfail_strict = true
filterwarnings = [
    # When running tests, treat warnings as errors (e.g. -Werror).
    # See: https://docs.pytest.org/en/latest/reference/reference.html#confval-filterwarnings
    "error",
    # Add additional warning suppressions as needed here. For example, if a third-party library
    # is throwing a deprecation warning that needs to be fixed upstream:
    # "ignore::DeprecationWarning:typer",
    "ignore::SyntaxWarning",
    # Ignore warnings from pytorch
    "ignore::DeprecationWarning",
    "ignore::UserWarning:torch.*",
]

markers = [
    "slow: Marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
branch = true

# To globally exclude additional code blocks from code coverage reporting, see:
# https://coverage.readthedocs.io/en/latest/excluding.html#advanced-exclusion
[tool.coverage.report]
exclude_also = [
    "case _ as unreachable",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
