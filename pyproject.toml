# Workspace meta-package that ties together the kcai data-sampling packages
# (core, images, job) and the umbrella CLI. No code lives at the root: it only
# declares the UV workspace and how the members resolve each other. Shared
# dev-tool sections (ruff / mypy) stay deferred; the pytest section is in
# scope and lives below.
[project]
name = "kcai-workspace"
dynamic = ["version"]
description = "Workspace for kcai data-sampling: generate samples from input samples"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "kcai-data-sampling>=0.0.1",
    "kcai-data-sampling-core>=0.0.1",
    "kcai-data-sampling-images>=0.0.1",
    "kcai-data-sampling-job>=0.0.1",
    "pandas>=3.0.6",
    "python-pptx",
]

[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

# Root meta package uses the src-layout convention (mirrors dqm-ml-workspace).
[tool.setuptools.packages.find]
where = ["src"]

# UV workspace: every package under packages/ is a member, resolved locally.
[tool.uv.workspace]
members = ["packages/*"]

# Local packages take precedence over any published versions.
[tool.uv.sources]
kcai-data-sampling-core = { workspace = true }
kcai-data-sampling-fgsm = { workspace = true }
kcai-data-sampling-images = { workspace = true }
kcai-data-sampling-images-lama = { workspace = true }
kcai-data-sampling-job = { workspace = true }
kcai-data-sampling = { workspace = true }
# torch resolves from the CPU index only (mirrors dqm-ml-workspace); the root
# never pulls it — only the opt-in -lama member depends on torch.
torch = { index = "pytorch" }

# CPU-only torch wheels for the opt-in -lama member (dqm-ml-workspace
# pattern). explicit: the index serves only packages routed to it by
# `[tool.uv.sources]` (torch), so the pytorch mirror's stale setuptools copy
# never shadows PyPI on a bare sync.
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
default-groups = ["nox"]

# Dependency groups, installed by uv/nox when running the corresponding task
# (mirrors dqm-ml-workspace; the association with a session lives in noxfile.py).
[dependency-groups]

# Session runner for the dev tasks defined in noxfile.py.
nox = [
    "nox-uv",
]

# Test suite: pytest plus reporting plugins. No pytest-randomly — the suite
# runs in a fixed order.
test = [
    "pytest",
    "pytest-cov",
    "pytest-html",
    "pytest-timeout",
    "pytest-sugar",
]

# opt-in surface: the same test deps as `test`, plus the -lama member. torch
# resolves from the CPU index via `[tool.uv.sources]`; the `test-lama` nox
# session runs the opt-in (torch-gated) tests for real. The default `test`
# group stays torch-free (Q2 pin).
test-lama = [
    "kcai-data-sampling-images-lama",
    { include-group = "test" },
]

# opt-in adversarial surface: the -fgsm member (numpy-only, no torch), pulled
# by `UV_INDEX= uv sync --group fgsm`. A later surface extends the group into
# the fgsm test suite; the default env gains nothing from it (Q2 pin).
fgsm = [
    "kcai-data-sampling-fgsm",
]

# opt-in adversarial test surface: the same test deps as `test`, plus the -fgsm
# member (numpy-only, no torch — no index, no download). The `test-fgsm` nox
# session runs the opt-in (importorskip-gated) adversarial tests for real. The
# default `test` group stays fgsm-free (Q1 pin).
test-fgsm = [
    "kcai-data-sampling-fgsm",
    { include-group = "test" },
]

# pytest config: strict, warnings-as-errors, a global per-test timeout, the
# HTML report, and our own basetemp to avoid the
# /tmp disk quota. Suppressions grow here as third-party warnings fire.
[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--html=pytest_report.html",
    "-vvv",
    "-s",
    "--timeout=300",
    "--basetemp=tmp",
    "-m",
    "not packaging",
]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore::SyntaxWarning",
]
markers = [
    "e2e: Full job runs driven through the CLI as a user would (tests/e2e/)",
    "slow: Marks potentially slow tests (deselect with '-m \"not slow\"')",
    "packaging: Marks package-isolation tests (deselect with '-m \"not packaging\"')",
]

[tool.setuptools_scm]
version_file = "src/kcai_workspace/_version_.py"
fallback_version = "0.0.1"
