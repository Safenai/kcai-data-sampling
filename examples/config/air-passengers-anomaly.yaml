# Newcomer demo, anomaly detection on Air Passengers (log scale).
# Data: python scripts/fetch_air_passengers_nile.py (Air Passengers, monthly, 1949-1960).
# One step is one month: the yearly season is 1/12 cycle per month.
# Values are log(thousands of passengers): an offset of -0.2 is a drop of about 18 %,
# a slope of -0.01 about -1 % per month, a sigma of 0.02 about 2 % noise.
# Windows: 36 months (24 of history, 12 to test), every month: 109 windows.
# The label comes from the ledger's `algorithm` column: `jitter` is normal
# variability, `level_shift`, `drift` and `add_sinusoid` are faults.
dataloaders:
  loaders:
    - name: air_passengers
      type: timeseries_parquet
      path: examples/data/air_passengers_nile/air_passengers.parquet
      id_column: series_id
      values_column: log_values
      load_batch_size: 128
      windows:
        mode: consecutive
        window: 36
        stride: 1

operations:
  outputs:
    path: examples/outputs/air-passengers-anomaly/{selection}/ledger.parquet
    write_samples: true
    samples_dir: examples/outputs/air-passengers-anomaly/{selection}/payloads
    payload_format: npy
    flush_batch_size: 512
    include: [series_id, start_window, end_window, start, freq]
  transformations:
    - name: counting_noise  # normal variability
      type: jitter
      sigma: 0.02
      seed: 0
    - name: demand_drop  # a lasting break, 3/4 into the window (month 27 of 36)
      type: level_shift
      offset:
        range: [-0.4, -0.05]
        samples: 6
        mode: even
        round: 4  # sweeps round to 2 decimals by default
      start: 0.75
    - name: demand_slump  # a gradual collapse over the window
      type: drift
      slope:
        range: [-0.02, -0.002]
        samples: 6
        mode: even
        round: 4  # sweeps round to 2 decimals by default
    - name: season_reshaped  # the yearly season distorted
      type: add_sinusoid
      frequency: 0.0833333
      phase: 1.5707963
      amplitude:
        range: [0.02, 0.2]
        samples: 6
        mode: even
        round: 4  # sweeps round to 2 decimals by default
