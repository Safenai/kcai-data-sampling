# Newcomer demo, forecasting on Air Passengers (log scale): degraded histories,
# to measure how the forecast of the next year degrades with them.
# Data: python scripts/fetch_air_passengers_nile.py (Air Passengers, monthly, 1949-1960).
# Values are log(thousands of passengers): a sigma of 0.05 is about 5 % noise.
# One step is one month: the yearly season is 1/12 ≈ 0.083 cycle per month.
# Each window is a two-year history; the true next year is read from the
# original series after `end_window`, so it is never transformed.
dataloaders:
  loaders:
    - name: air_passengers
      type: timeseries_parquet
      path: examples/data/air_passengers_nile/air_passengers.parquet
      id_column: series_id
      values_column: log_values
      load_batch_size: 128
      windows:
        mode: consecutive
        window: 24  # two years of history
        stride: 1

operations:
  outputs:
    path: examples/outputs/air-passengers-forecasting/{selection}/ledger.parquet
    write_samples: true
    samples_dir: examples/outputs/air-passengers-forecasting/{selection}/payloads
    payload_format: npy
    flush_batch_size: 512
    include: [series_id, start_window, end_window, start, freq]
  transformations:
    # Counting noise, from none (the reference) to about 10 %.
    - name: counting_noise
      type: jitter
      sigma:
        range: [0.0, 0.1]
        samples: 5
        mode: even
      seed: 0
    # Smoothed reporting: 0.1 keeps little more than the yearly season, 0.3 almost everything.
    - name: smoothed_reporting
      type: low_pass
      cutoff:
        range: [0.1, 0.3]
        samples: 3
        mode: even
