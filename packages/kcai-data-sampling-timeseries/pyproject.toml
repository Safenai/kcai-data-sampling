[project]
name = "kcai-data-sampling-timeseries"
dynamic = ["dependencies", "version"]
description = "No-model time-series transformations for kcai data-sampling"
authors = [
  {name = "Safenai", email = "support@safenai.io"},
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ml", "data", "augmentation", "robustness", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.entry-points."kcai_data_sampling.transformations"]
low_pass = "kcai_data_sampling_timeseries.api.transformations.low_pass:LowPass"
add_sinusoid = "kcai_data_sampling_timeseries.api.transformations.add_sinusoid:AddSinusoid"
jitter = "kcai_data_sampling_timeseries.api.transformations.jitter:Jitter"

[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "src/kcai_data_sampling_timeseries/_version_.py"
root = "../.."
fallback_version = "0.0.1"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
