[project]
name = "kcai-data-sampling-art"
dynamic = ["dependencies", "version"]
description = "Adversarial attacks from the Adversarial Robustness Toolbox (ART) for kcai data-sampling"
authors = [
  {name = "Safenai", email = "support@safenai.io"},
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ml", "data", "augmentation", "robustness", "adversarial", "fgsm", "square", "pgd", "mim", "simba", "hopskipjump", "art"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.entry-points."kcai_data_sampling.transformations"]
art_fgsm = "kcai_data_sampling_art.api.transformations.fgsm:ArtFgsm"
art_square = "kcai_data_sampling_art.api.transformations.square:ArtSquare"
art_pgd = "kcai_data_sampling_art.api.transformations.pgd:ArtPgd"
art_mim = "kcai_data_sampling_art.api.transformations.pgd:ArtMim"
art_simba = "kcai_data_sampling_art.api.transformations.simba:ArtSimba"
art_hopskipjump = "kcai_data_sampling_art.api.transformations.hopskipjump:ArtHopSkipJump"

[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "src/kcai_data_sampling_art/_version_.py"
root = "../.."
fallback_version = "0.0.1"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kcai_data_sampling_art = ["py.typed"]