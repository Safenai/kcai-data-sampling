[project]
name = "kcai-data-sampling-albumentation"
dynamic = ["dependencies", "version"]
description = "Procedural image transformations backed by a pinned albumentations for kcai data-sampling"
authors = [
  {name = "Safenai", email = "support@safenai.io"},
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ml", "data", "augmentation", "robustness", "images", "albumentations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.entry-points."kcai_data_sampling.transformations"]
