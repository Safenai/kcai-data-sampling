[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "kcai-data-sampling"

description = "Samples generation utilities managed with uv"
dynamic = ["dependencies", "version"]
authors = [
  {name = "Safenai", email="support@safenai.io"},   
]
readme = "README.md"
requires-python = ">=3.11"
license ="Apache-2.0"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools_scm]
version_file = "src/kcai_data_sampling/_version_.py"
root= "../.."

