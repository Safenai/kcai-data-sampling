[project]
name = "kcai-data-sampling-images-lama"
dynamic = ["dependencies", "version"]
description = "Generative inpaint transformation (LaMa) and the associated tool-model plugin for kcai data-sampling"
authors = [
  {name = "Safenai", email = "support@safenai.io"},
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ml", "data", "augmentation", "robustness", "images", "inpainting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.entry-points."kcai_data_sampling.transformations"]
inpaint = "kcai_data_sampling_images_lama.api.transformations.inpaint:Inpaint"

[project.entry-points."kcai_data_sampling.models"]
lama_inpaint = "kcai_data_sampling_images_lama.api.models.lama:LamaTool"

[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "src/kcai_data_sampling_images_lama/_version_.py"
root = "../.."
fallback_version = "0.0.1"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kcai_data_sampling_images_lama = ["py.typed"]