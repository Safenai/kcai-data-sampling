name: Publish

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  check-main:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      is_on_main: ${{ steps.check.outputs.is_on_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if tag commit is on main
        id: check
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --depth=1
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "is_on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_on_main=false" >> "$GITHUB_OUTPUT"
          fi

  publish-pypi:
    needs: check-main
    if: needs.check-main.outputs.is_on_main == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    # Named here, once, because the tolerant wrapper defaults to Test PyPI: a step
    # that omits the URL publishes production artifacts to the throwaway index
    # and still exits green. One definition keeps the six steps from disagreeing.
    env:
      PUBLISH_URL: https://upload.pypi.org/legacy/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup

      - name: Validate tag format
        run: |
          TAG="${{ github.ref_name }}"
          if ! echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-?(rc|a)[0-9]+)?$'; then
            echo "Invalid tag format: $TAG"
            echo "Allowed: X.Y.Z, X.Y.Z[-](rc|a)D"
            exit 1
          fi

      - name: Derive publishable version from tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(printf '%s' "$TAG" | sed 's/-//g')
          echo "Pretend version: $VERSION (from tag $TAG)"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build packages
        run: |
          uv build packages/kcai-data-sampling-core
          uv build packages/kcai-data-sampling-images
          uv build packages/kcai-data-sampling-lama
          uv build packages/kcai-data-sampling-fgsm
          uv build packages/kcai-data-sampling-job
          uv build packages/kcai-data-sampling

      - name: Publish kcai-data-sampling-core
        run: bash .github/scripts/publish-tolerantly.sh 'dist/kcai_data_sampling_core-*' "$PUBLISH_URL"

      - name: Publish kcai-data-sampling-images
        run: bash .github/scripts/publish-tolerantly.sh 'dist/kcai_data_sampling_images-*' "$PUBLISH_URL"

      - name: Publish kcai-data-sampling-lama
        run: bash .github/scripts/publish-tolerantly.sh 'dist/kcai_data_sampling_lama-*' "$PUBLISH_URL"

      - name: Publish kcai-data-sampling-fgsm
        run: bash .github/scripts/publish-tolerantly.sh 'dist/kcai_data_sampling_fgsm-*' "$PUBLISH_URL"

      - name: Publish kcai-data-sampling-job
        run: bash .github/scripts/publish-tolerantly.sh 'dist/kcai_data_sampling_job-*' "$PUBLISH_URL"

      - name: Publish kcai-data-sampling
        run: bash .github/scripts/publish-tolerantly.sh 'dist/kcai_data_sampling-*' "$PUBLISH_URL"