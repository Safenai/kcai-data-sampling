# Set strict to true to turn warnings into errors to catch warnings within CI.
strict: false
use_directory_urls: false
validation:
  omitted_files: ignore
  absolute_links: warn
  unrecognized_links: ignore
  anchors: ignore
theme:
  name: material
  # By default, fonts are pulled from Google on the Internet. To support offline usage, this is
  # disabled.
  font: false
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    # GitHub specific.
    repo: fontawesome/brands/github
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.indexes
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.prune

markdown_extensions:
  - abbr
  - admonition
  - github-callouts
  - footnotes
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - md_in_html
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - static/stylesheets/extra.css

plugins:
  - mkdocs-simple-hooks:
      hooks:
        on_pre_build: "docs.hooks:pre_build"
        on_page_markdown: "docs.hooks:page_markdown"
  - search
  - offline:
      enabled: !ENV [MKDOCS_MATERIAL_OFFLINE, false]
  - mermaid2:
      version: 11.16.0
      arguments:
        securityLevel: loose
        htmlLabels: false
  - mkdocstrings:
      handlers:
        python:
          options:
            show_if_no_docstring: true
            show_signature_annotations: true
  # Autodoc configuration.
  # https://github.com/tlambert03/mkdocs-api-autonav#configuration
  - api-autonav:
      modules: [
        "packages/kcai-data-sampling-core/src/kcai_data_sampling_core/",
        "packages/kcai-data-sampling-images/src/kcai_data_sampling_images/",
        "packages/kcai-data-sampling-lama/src/kcai_data_sampling_lama/",
        "packages/kcai-data-sampling-fgsm/src/kcai_data_sampling_fgsm/",
        "packages/kcai-data-sampling-job/src/kcai_data_sampling_job/",
      ]
  # mkdocs-jupyter must come after api-autonav to handle generated files correctly
  - mkdocs-jupyter
  # This plugin is used to validate URLs (including anchors).
  - htmlproofer:
      # This is not enabled by default because this requires network I/O, so it is inherently not
      # exactly reproducible. For larger projects, this can also slow local build times.
      validate_external_urls: !ENV [HTMLPROOFER_VALIDATE_EXTERNAL_URLS, false]
      enabled: !ENV [MKDOCS_HTMLPROOFER_ENABLED, false]
      raise_error: false
watch:
  # Watch directories to reload on changes to docstrings for mkdocstrings plugin.
  - "packages/kcai-data-sampling-core/src/kcai_data_sampling_core/"
  - "packages/kcai-data-sampling-images/src/kcai_data_sampling_images/"
  - "packages/kcai-data-sampling-lama/src/kcai_data_sampling_lama/"
  - "packages/kcai-data-sampling-fgsm/src/kcai_data_sampling_fgsm/"
  - "packages/kcai-data-sampling-job/src/kcai_data_sampling_job/"
  - "packages/kcai-data-sampling/src/kcai_data_sampling/"
  - "docs"
site_name: KCAI Data-Sampling
copyright: Copyright &copy; SafenAI
# GitHub Specific Configuration.
repo_name: kcai-data-sampling
repo_url: https://github.com/Safenai/kcai-data-sampling
edit_uri: edit/main/docs/
nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Terminology: terminology.md
  - Packaging Tests: packaging-tests.md
  - Developer Guide: developer.md
  - Examples:
    - Walkthrough Notebook: examples/notebooks/walkthrough.ipynb
  - Packages:
    - Core: packages/kcai-data-sampling-core.md
    - Images: packages/kcai-data-sampling-images.md
    - Images (LaMa): packages/kcai-data-sampling-lama.md
    - FGSM: packages/kcai-data-sampling-fgsm.md
    - Job: packages/kcai-data-sampling-job.md
    - CLI: packages/kcai-data-sampling.md