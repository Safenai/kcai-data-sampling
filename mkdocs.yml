# Set strict to true to turn warnings into errors to catch warnings within CI.
strict: false
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
theme:
  name: material
  # By default, fonts are pulled from Google on the Internet. To support offline usage, this is
  # disabled.
  font: false
  palette:
    scheme: slate
    primary: green
    accent: yellow
  icon:
    logo: material/math-integral-box
    # GitHub specific.
    repo: fontawesome/brands/github
  favicon: assets/favicon.png
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.indexes
    - navigation.expand
    - navigation.footer
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
markdown_extensions:
  - abbr
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - md_in_html
extra_css:
  - assets/style.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Safenai/kcai-workspace
plugins:
  - search
  - offline:
      enabled: !ENV [MKDOCS_MATERIAL_OFFLINE, false]
  - mkdocstrings:
      handlers:
        python:
          options:
            show_if_no_docstring: true
            show_signature_annotations: true
  - mkdocs-jupyter:
      include: ["notebooks/*.ipynb"]
  # Autodoc configuration.
  # https://github.com/tlambert03/mkdocs-api-autonav#configuration
  - api-autonav:
      modules: [
        "packages/kcai-data-sampling/src/kcai_data_sampling/",
        "packages/kcai-dataset/src/kcai_dataset/",
        "src/kcai_workspace/",
      ]
  # This plugin is used to validate URLs (including anchors).
  - htmlproofer:
      # This is not enabled by default because this requires network I/O, so it is inherently not
      # exactly reproducible. For larger projects, this can also slow local build times.
      validate_external_urls: !ENV [HTMLPROOFER_VALIDATE_EXTERNAL_URLS, false]
      raise_error: false
watch:
  # Watch src/ directory to reload on changes to docstrings for mkdocstrings plugin.
  - src
  - packages
site_name: KCAI
copyright: Copyright &copy; SafenAI
# GitHub Specific Configuration.
repo_name: kcai-workspace
repo_url: https://github.com/Safenai/kcai-workspace
edit_uri: edit/main/docs/
nav:
  - Home: index.md
  - Tutorials:
    - Basic Usage: notebooks/1_basic_usage.ipynb
    - Dataset Management: notebooks/0_dataset.ipynb
  - API Reference: api/
